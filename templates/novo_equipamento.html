{% extends 'base.html' %}

{% block title %}Novo Equipamento - Emprestados{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card p-4">
            <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3">
                <h4 class="fw-bold mb-0"><i class="bi bi-plus-circle text-primary me-2"></i>Cadastrar Equipamento</h4>
                <a href="{{ url_for('listar_equipamentos') }}" class="btn btn-sm btn-outline-secondary">Voltar</a>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="patrimonio" class="form-label fw-semibold">Código de Patrimônio / Tag <span class="text-danger">*</span></label>
                    <input type="text" class="form-control text-uppercase" id="patrimonio" name="patrimonio" placeholder="Ex: NB-001, MON-102" required autofocus>
                    <div class="form-text">Identificador único do equipamento na instituição/empresa.</div>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label fw-semibold">Tipo de Equipamento <span class="text-danger">*</span></label>
                    <select class="form-select" id="tipo" name="tipo" required>
                        <option value="" disabled selected>Selecione um tipo...</option>
                        <option value="Notebook">Notebook</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Teclado">Teclado</option>
                        <option value="Mouse">Mouse</option>
                        <option value="Headset">Headset</option>
                        <option value="Adaptador / Cabo">Adaptador / Cabo</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="marca_modelo" class="form-label fw-semibold">Marca e Modelo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="marca_modelo" name="marca_modelo" placeholder="Ex: Dell Inspiron 15, LG 24 polegadas..." required>
                </div>

                <div class="mb-4">
                    <label for="descricao" class="form-label fw-semibold">Observações / Especificações Adicionais</label>
                    <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Ex: 16GB RAM, SSD 512GB, acompanha carregador original..."></textarea>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary py-2 fw-semibold">
                        <i class="bi bi-check-lg me-1"></i> Salvar Equipamento
                    </button>
                    <a href="{{ url_for('listar_equipamentos') }}" class="btn btn-light py-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
