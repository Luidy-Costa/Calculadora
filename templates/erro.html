{% extends 'base.html' %}

{% block title %}Erro {{ status_code }} - Emprestados{% endblock %}

{% block content %}
<div class="row justify-content-center text-center my-5">
    <div class="col-md-6">
        <div class="card p-5">
            <h1 class="display-1 fw-bold text-danger">{{ status_code }}</h1>
            <h3 class="fw-bold mb-3">Ocorreu um Erro no Servidor</h3>
            <p class="text-muted mb-4">
                {{ error }}
                <br>
                Esta ocorrência foi enviada automaticamente para o monitoramento no Sentry.
            </p>
            <div>
                <a href="{{ url_for('index') }}" class="btn btn-primary">
                    <i class="bi bi-house-door me-1"></i> Voltar ao Painel Principal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
