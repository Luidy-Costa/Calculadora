<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
<script 
  src="https://browser.sentry-cdn.com/8.34.0/bundle.min.js" 
  crossorigin="anonymous">
</script>
</head>
<body>
    <h1>Calculadora</h1>
    
    <input type="number" id="num1" placeholder="1º Número">
    
    <select id="operacao">
        <option value="1">Soma (+)</option>
        <option value="2">Subtração (-)</option>
        <option value="3">Multiplicação (*)</option>
        <option value="4">Divisão (/)</option>
    </select>

    <input type="number" id="num2" placeholder="2º Número">
    
    <button onclick="myUndefinedFunction()">Calcular</button>

    <h2>Resultado: <span id="resultado">...</span></h2>

    <h3>Histórico de Cálculos:</h3>
    <ul id="historico"></ul>

    <script src="calculadora.js"></script>
</body>
</html>
